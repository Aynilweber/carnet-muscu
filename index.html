<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0e13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Muscu">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<title>Carnet de muscu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Direction: a gym scoreboard. Graphite floor, chalk-white type, huge condensed numerals.
   Colour borrowed from bumper plates: plate blue = action, plate red = record. */
:root{
  --bg:#0c0e13; --surface:#151821; --surface-2:#1c202b; --line:#272c39;
  --ink:#eef0f5; --muted:#8b93a7; --faint:#5b6377;
  --blue:#3d6ff2; --blue-soft:rgba(61,111,242,.16);
  --red:#ff5638; --red-soft:rgba(255,86,56,.15);
  --good:#38c98a;
  --display:"Big Shoulders Display","Oswald","Arial Narrow",Impact,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:500 15px/1.45 var(--body);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}

.app{max-width:640px;margin:0 auto;min-height:100%;padding:calc(10px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(110px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
.topbar[hidden]{display:none}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:8px 0 16px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.title{font:900 44px/0.9 var(--display);text-transform:uppercase;letter-spacing:.01em;margin:4px 0 0;text-wrap:balance}
main{display:grid;gap:14px}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(12,14,19,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px calc(8px + env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left))}
.nav-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{display:grid;justify-items:center;gap:2px;padding:6px 0;color:var(--faint);font-size:11px;font-weight:700;letter-spacing:.02em}
.nav button svg{width:24px;height:24px}
.nav button[aria-current="page"]{color:var(--ink)}
.nav button[aria-current="page"] svg{color:var(--blue)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px}
.card h2{font:800 22px/1 var(--display);text-transform:uppercase;letter-spacing:.03em;margin:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.muted{color:var(--muted)} .small{font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:13px 18px;font-weight:800;font-size:15px;background:var(--blue);color:#fff;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.block{width:100%}
.btn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--red);border:1px solid rgba(255,86,56,.4)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.45;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.blue{background:var(--blue-soft);border-color:transparent;color:#9db7ff}
input,select,textarea{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--blue);outline:none}
label.f{display:grid;gap:6px;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:28px 18px;text-align:center;color:var(--muted)}

.board{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.board>div{padding:14px 12px;border-right:1px solid var(--line)}
.board>div:last-child{border-right:0}
.big{font:900 40px/0.95 var(--display);font-variant-numeric:tabular-nums}
.big small{font-size:18px;color:var(--muted);margin-left:2px}
.lbl{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:6px}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{display:grid;justify-items:center;gap:6px;padding:8px 0;border-radius:10px;font-size:12px;font-weight:700;color:var(--muted)}
.day i{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:13px;color:var(--faint)}
.day.on i{background:var(--blue);border-color:var(--blue);color:#fff}
.day.today{color:var(--ink)}
.day.today i{border-color:var(--ink)}

.hero{position:relative;overflow:hidden;background:linear-gradient(160deg,#1a2240 0%,var(--surface) 55%);border:1px solid #2a3558}
.hero .bar{position:absolute;right:-30px;top:10px;width:180px;height:180px;opacity:.10;color:#fff;pointer-events:none}
.tmpl{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);text-align:left;width:100%}
.tmpl b{display:block;font-weight:800}
.tmpl span{font-size:12px;color:var(--muted)}

/* Live session */
.live{position:sticky;top:0;z-index:10;background:rgba(12,14,19,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);margin:0 -16px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line)}
.clock{font:900 46px/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.live .meta{display:flex;gap:14px;font-size:12px;color:var(--muted);font-weight:700;flex-wrap:wrap}
.live .meta b{color:var(--ink);font-size:14px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ex-h{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px 10px 6px 12px}
.ex-name{font:800 22px/1.05 var(--display);text-transform:uppercase;letter-spacing:.02em}
.ex-sub{font-size:12px;color:var(--muted);font-weight:600;margin-top:2px}
.ex-prev{padding:2px 14px 8px;font-size:12px;color:var(--muted)}
.picto{width:44px;height:44px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;color:#9db7ff;flex:none}
.picto svg{width:26px;height:26px}
.icon-btn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--muted);flex:none}
.icon-btn:hover{color:var(--ink);background:var(--surface-2)}
.icon-btn svg{width:18px;height:18px}
.sets-h,.set{display:grid;grid-template-columns:30px 1.1fr 1fr 1fr 44px;gap:8px;align-items:center;padding:0 12px}
.sets-h{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);padding-bottom:4px}
.sets-h span{text-align:center}.sets-h span:nth-child(2){text-align:left}
.set{padding-top:5px;padding-bottom:5px;transition:background .2s}
.set .n{font:800 18px var(--display);color:var(--muted);text-align:center}
.set .pv{font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.set input{text-align:center;padding:9px 4px;font-weight:800;font-variant-numeric:tabular-nums}
.set input::placeholder{color:var(--faint);font-weight:600}
.set .nil{text-align:center;color:var(--faint)}
.check{width:44px;height:40px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;color:var(--faint)}
.check svg{width:20px;height:20px}
.set.done{background:rgba(56,201,138,.08)}
.set.done .check{background:var(--good);border-color:var(--good);color:#06150e}
.set.pr .n{color:var(--red)}
.pr-tag{font:800 10px var(--body);letter-spacing:.08em;color:var(--red);text-transform:uppercase}
.ex-f{display:flex;justify-content:space-between;padding:8px 12px 12px}

.rest{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom));z-index:25;display:flex;align-items:center;gap:12px;background:var(--ink);color:#0c0e13;border-radius:999px;padding:8px 8px 8px 10px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.rest[hidden]{display:none}
.rest svg.ring{width:40px;height:40px;transform:rotate(-90deg)}
.rest .t{font:900 28px/1 var(--display);font-variant-numeric:tabular-nums;min-width:62px}
.rest button{white-space:nowrap;background:#0c0e13;color:var(--ink);border-radius:999px;padding:8px 12px;font-weight:800;font-size:13px}
.rest.ding{animation:ding .6s ease 3}
@keyframes ding{50%{transform:translateX(-50%) scale(1.06)}}

/* Sheets */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg[hidden]{display:none}
.sheet{width:100%;max-width:640px;background:var(--surface);border-top-left-radius:22px;border-top-right-radius:22px;border:1px solid var(--line);padding:20px 16px calc(20px + env(safe-area-inset-bottom));display:grid;gap:14px;animation:up .22s ease;max-height:100%;overflow:auto}
.sheet h3{font:800 26px/1 var(--display);text-transform:uppercase;margin:0}
@keyframes up{from{transform:translateY(30px);opacity:.4}}

/* Library */
.lib{height:calc(100% - 24px - env(safe-area-inset-top));display:flex;flex-direction:column;gap:0;padding:0;overflow:hidden}
.lib-top{padding:16px 16px 10px;display:grid;gap:10px;border-bottom:1px solid var(--line)}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--faint)}
.search input{padding-left:38px;font-weight:600}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;border-radius:999px;padding:7px 13px;background:var(--surface-2);border:1px solid var(--line);font-weight:700;font-size:13px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:#0c0e13;border-color:var(--ink)}
.seg.eq button[aria-pressed="true"]{background:var(--blue);color:#fff;border-color:var(--blue)}
.lib-list{flex:1;overflow-y:auto;padding:4px 16px 16px;-webkit-overflow-scrolling:touch}
.grp{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);padding:14px 0 6px}
.item{width:100%;display:grid;grid-template-columns:44px 1fr 26px;gap:12px;align-items:center;padding:8px 0;text-align:left;border-bottom:1px solid var(--line)}
.item b{display:block;font-weight:700;font-size:15px}
.item span{font-size:12px;color:var(--muted)}
.tick{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent}
.tick svg{width:14px;height:14px}
.item[aria-pressed="true"] .tick{background:var(--blue);border-color:var(--blue);color:#fff}
.item[aria-pressed="true"] .picto{border-color:var(--blue)}
.lib-foot{padding:10px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:10px}

/* History */
.month{font:800 14px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:10px 2px 0}
.sess{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.sess>button{width:100%;display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:center;padding:12px 14px;text-align:left}
.date-box{display:grid;justify-items:center;background:var(--surface-2);border-radius:10px;padding:6px 0}
.date-box b{font:900 26px/1 var(--display)}
.date-box span{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sess .t1{font-weight:800}
.sess .t2{font-size:12px;color:var(--muted)}
.sess-body{border-top:1px solid var(--line);padding:10px 14px 14px;display:grid;gap:8px}
.sess-body[hidden]{display:none}
.ex-line{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.ex-line span:last-child{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}

/* Progress */
svg.chart{width:100%;height:auto;display:block;overflow:visible}
svg.chart text{fill:var(--faint);font:600 10px var(--body)}
svg.chart .g{stroke:var(--line)}
.mus{display:grid;grid-template-columns:96px 1fr 30px;gap:10px;align-items:center;font-size:13px;font-weight:700}
.mus .track{height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.mus .track i{display:block;height:100%;background:var(--blue);border-radius:999px}
.mus b{text-align:right;font-variant-numeric:tabular-nums}
.prs{display:grid;gap:2px}
.pr-row{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:baseline;padding:10px 0;border-top:1px solid var(--line)}
.pr-row:first-child{border-top:0}
.pr-row b{font:900 24px/1 var(--display);font-variant-numeric:tabular-nums}
.pr-row span{font-size:12px;color:var(--muted)}

.meter{height:12px;border-radius:999px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),#7a9cff);border-radius:999px}
pre.recap{margin:0;white-space:pre-wrap;font:500 13px/1.6 var(--body);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);z-index:60;background:var(--ink);color:#0c0e13;font-weight:800;font-size:14px;padding:10px 16px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.4);white-space:nowrap}
.toast[hidden]{display:none}
.toast.red{background:var(--red);color:#fff}

/* Rank & level */
.rank-hero{display:grid;grid-template-columns:96px 1fr;gap:16px;align-items:center;position:relative;overflow:hidden}
.rank-hero .glow{position:absolute;inset:-40% -10% auto auto;width:260px;height:260px;border-radius:50%;filter:blur(50px);opacity:.25;pointer-events:none}
.emblem{width:96px;height:96px}
.rank-name{font:900 40px/0.95 var(--display);text-transform:uppercase;letter-spacing:.02em}
.xpbar{height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-top:8px}
.xpbar i{display:block;height:100%;border-radius:999px}
.bodies{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.bodies figure{margin:0;display:grid;gap:4px;justify-items:center}
.bodies figcaption{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
svg.body{width:100%;max-width:220px;height:auto}
svg.body .nz{fill:#232836}
svg.body .m{cursor:pointer;transition:opacity .15s}
svg.body .m:hover{opacity:.85}
svg.body .m.sel polygon:first-child{stroke:#fff;stroke-width:.9;stroke-linejoin:round}
.legend{display:flex;flex-wrap:wrap;gap:8px 12px;font-size:12px;font-weight:700;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.mrow{display:grid;grid-template-columns:96px 1fr auto;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line);width:100%;text-align:left;font-size:14px;font-weight:700}
.mrow:first-child{border-top:0}
.mrow .track{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.mrow .track i{display:block;height:100%;border-radius:999px}
.tier{font:800 12px var(--body);padding:3px 9px;border-radius:999px;white-space:nowrap;color:#0c0e13}
/* Heatmap */
.heat{width:100%;height:auto;display:block}
.heat text{fill:var(--faint);font:700 9px var(--body)}
.yearnav{display:flex;align-items:center;gap:6px}
/* Program */
.pday{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.pday.next{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue) inset}
.pday-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 14px 8px}
.pday-h b{font:800 24px/1 var(--display);text-transform:uppercase;letter-spacing:.02em}
.pex{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding:8px 14px;border-top:1px solid var(--line)}
.pex .picto{width:36px;height:36px;border-radius:10px}
.pex .picto svg{width:20px;height:20px}
.pex b{display:block;font-size:14px}
.pex span{font-size:12px;color:var(--muted)}
.pex .sr{text-align:right;font-weight:800;font-variant-numeric:tabular-nums;font-size:14px}
.pex .sr small{display:block;font-size:12px;color:#9db7ff;font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px;align-items:end}
.seg.inline{margin:0;padding:0}
@media (max-width:380px){.title{font-size:38px}.big{font-size:34px}.sets-h,.set{grid-template-columns:26px 1fr 1fr 1fr 42px;gap:6px}}

/* ===== v6 polish: depth, glass, floating tab bar ===== */
body{background:radial-gradient(120% 60% at 50% -10%,rgba(61,111,242,.18),transparent 60%),radial-gradient(80% 40% at 100% 0%,rgba(255,86,56,.06),transparent 60%),var(--bg);background-attachment:fixed}
:root{--r:18px}
.card,.ex,.sess,.pday,.board{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.01)) ,var(--surface);border:1px solid rgba(255,255,255,.07);box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 12px 32px -18px rgba(0,0,0,.8)}
.card h2{font-size:24px}
.btn{background:linear-gradient(180deg,#5a85ff,#3461e8);box-shadow:0 8px 22px -10px rgba(61,111,242,.9),0 1px 0 rgba(255,255,255,.25) inset}
.btn.ghost{background:rgba(255,255,255,.05);box-shadow:none;border:1px solid rgba(255,255,255,.09)}
.btn.danger{box-shadow:none}
input,select,textarea{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.09)}
.chip{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.08)}
.nav{left:50%;right:auto;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));width:min(612px,calc(100% - 24px));border-radius:24px;border:1px solid rgba(255,255,255,.09);background:rgba(18,21,29,.78);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);padding:6px;box-shadow:0 18px 40px -12px rgba(0,0,0,.9)}
.nav button{border-radius:18px;padding:7px 0 6px;transition:background .2s,color .2s}
.nav button[aria-current="page"]{background:rgba(61,111,242,.16);color:#fff}
.nav button[aria-current="page"] svg{color:#7d9dff}
.app{padding-bottom:calc(120px + env(safe-area-inset-bottom))}
.rest{bottom:calc(92px + env(safe-area-inset-bottom))}
.title{background:linear-gradient(180deg,#fff 30%,#aeb6c8);-webkit-background-clip:text;background-clip:text;color:transparent}
.big{letter-spacing:.01em}
.hero{background:radial-gradient(120% 120% at 100% 0%,rgba(61,111,242,.35),transparent 55%),linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.01)),var(--surface);border-color:rgba(125,157,255,.25)}
.rank-hero{grid-template-columns:96px 1fr}
.rank-name{font-size:clamp(26px,8.5vw,40px);white-space:nowrap}
.rank-hero .emblem{filter:drop-shadow(0 10px 24px rgba(0,0,0,.6))}
.rank-hero .glow{opacity:.35;width:320px;height:320px}
.bodies{position:relative;padding:8px 0;background:radial-gradient(60% 50% at 50% 45%,rgba(61,111,242,.12),transparent 70%)}
svg.body{max-width:260px;filter:drop-shadow(0 14px 22px rgba(0,0,0,.55))}

<body>
<div class="app">
  <header class="topbar" id="topbar">
    <div><div class="eyebrow" id="eyebrow"></div><h1 class="title" id="vtitle">Séance</h1></div>

</div>

<div class="rest" id="rest" hidden role="timer" aria-live="polite">

  <button type="button" id="restSkip">Passer</button>
</div>

<div class="sheet-bg" id="sheet" hidden></div>

<nav class="nav" aria-label="Navigation">

    <button type="button" data-v="programme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6M9 4a2 2 0 00-2 2v0H6a2 2 0 00-2 2v11a2 2 0 002 2h12a2 2 0 002-2V8a2 2 0 00-2-2h-1a2 2 0 00-2-2"/><path d="M8 12h8M8 16h5"/></svg>Programme</button>

    <button type="button" data-v="historique"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Calendrier</button>

  </div>

<script>
/* ===== Exercise library =====
   k (kind): w = charge × reps · bw = poids du corps (+ lest) × reps · t = durée (s) · c = cardio (km + min) */
const MUSCLES=["Pectoraux","Dos","Épaules","Biceps","Triceps","Quadriceps","Ischios","Fessiers","Mollets","Abdos","Cardio"];
const EQUIP=["Machine","Poulie","Barre","Haltères","Smith","Poids du corps","Cardio"];
const LIB=[
 ["Développé couché","Pectoraux","Barre","w"],["Développé incliné à la barre","Pectoraux","Barre","w"],["Développé couché haltères","Pectoraux","Haltères","w"],["Développé incliné haltères","Pectoraux","Haltères","w"],["Écarté couché haltères","Pectoraux","Haltères","w"],["Presse à pectoraux (chest press)","Pectoraux","Machine","w"],["Presse inclinée (machine)","Pectoraux","Machine","w"],["Butterfly (pec deck)","Pectoraux","Machine","w"],["Écarté à la poulie vis-à-vis","Pectoraux","Poulie","w"],["Développé couché à la Smith","Pectoraux","Smith","w"],["Dips","Pectoraux","Poids du corps","bw"],["Pompes","Pectoraux","Poids du corps","bw"],
 ["Tractions","Dos","Poids du corps","bw"],["Tractions assistées","Dos","Machine","w"],["Tirage vertical (poulie haute)","Dos","Poulie","w"],["Tirage horizontal assis","Dos","Poulie","w"],["Rowing barre","Dos","Barre","w"],["Rowing haltère à un bras","Dos","Haltères","w"],["Rowing assis (machine)","Dos","Machine","w"],["Tirage vertical (machine)","Dos","Machine","w"],["Rowing T-bar","Dos","Barre","w"],["Pull-over à la poulie","Dos","Poulie","w"],["Soulevé de terre","Dos","Barre","w"],["Extensions lombaires","Dos","Poids du corps","bw"],["Shrugs haltères (trapèzes)","Dos","Haltères","w"],
 ["Développé militaire","Épaules","Barre","w"],["Développé épaules haltères","Épaules","Haltères","w"],["Presse épaules (machine)","Épaules","Machine","w"],["Élévations latérales haltères","Épaules","Haltères","w"],["Élévations latérales à la poulie","Épaules","Poulie","w"],["Élévations latérales (machine)","Épaules","Machine","w"],["Oiseau (reverse pec deck)","Épaules","Machine","w"],["Face pull","Épaules","Poulie","w"],["Développé épaules à la Smith","Épaules","Smith","w"],
 ["Curl barre","Biceps","Barre","w"],["Curl haltères","Biceps","Haltères","w"],["Curl marteau","Biceps","Haltères","w"],["Curl pupitre (machine)","Biceps","Machine","w"],["Curl à la poulie basse","Biceps","Poulie","w"],["Curl incliné haltères","Biceps","Haltères","w"],
 ["Extension triceps à la poulie (corde)","Triceps","Poulie","w"],["Extension triceps à la poulie (barre)","Triceps","Poulie","w"],["Barre au front","Triceps","Barre","w"],["Extension nuque haltère","Triceps","Haltères","w"],["Triceps (machine dips)","Triceps","Machine","w"],["Kickback haltère","Triceps","Haltères","w"],["Développé couché prise serrée","Triceps","Barre","w"],
 ["Squat","Quadriceps","Barre","w"],["Squat à la Smith","Quadriceps","Smith","w"],["Presse à cuisses","Quadriceps","Machine","w"],["Hack squat","Quadriceps","Machine","w"],["Leg extension","Quadriceps","Machine","w"],["Goblet squat","Quadriceps","Haltères","w"],["Fentes haltères","Quadriceps","Haltères","w"],["Fentes bulgares","Quadriceps","Haltères","w"],
 ["Leg curl allongé","Ischios","Machine","w"],["Leg curl assis","Ischios","Machine","w"],["Soulevé de terre roumain","Ischios","Barre","w"],["Soulevé de terre jambes tendues haltères","Ischios","Haltères","w"],
 ["Hip thrust","Fessiers","Barre","w"],["Hip thrust (machine)","Fessiers","Machine","w"],["Abducteurs (machine)","Fessiers","Machine","w"],["Adducteurs (machine)","Fessiers","Machine","w"],["Kickback fessier à la poulie","Fessiers","Poulie","w"],
 ["Mollets debout (machine)","Mollets","Machine","w"],["Mollets assis (machine)","Mollets","Machine","w"],["Mollets à la presse","Mollets","Machine","w"],
 ["Crunch","Abdos","Poids du corps","bw"],["Crunch (machine)","Abdos","Machine","w"],["Crunch à la poulie","Abdos","Poulie","w"],["Relevés de jambes suspendu","Abdos","Poids du corps","bw"],["Roue abdominale","Abdos","Poids du corps","bw"],["Russian twist","Abdos","Poids du corps","bw"],["Gainage","Abdos","Poids du corps","t"],["Gainage latéral","Abdos","Poids du corps","t"],
 ["Tapis de course","Cardio","Cardio","c"],["Vélo","Cardio","Cardio","c"],["Vélo elliptique","Cardio","Cardio","c"],["Rameur","Cardio","Cardio","c"],["Stepper (StairMaster)","Cardio","Cardio","c"],["Corde à sauter","Cardio","Cardio","t"]
];
const PICTO={
 "Machine":'<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 28V4M6 4h10M16 4v6"/><rect x="13" y="10" width="6" height="9" rx="1"/><path d="M14 13h4M14 16h4M6 22h12l4 6M10 28h16"/></svg>',
 "Poulie":'<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="16" cy="6" r="3"/><path d="M16 9v13M10 22h12M10 22l-2 4M22 22l2 4M4 3h24"/></svg>',
 "Barre":'<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 16h26M7 10v12M10 8v16M22 8v16M25 10v12"/></svg>',
 "Haltères":'<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M10 16h12M6 11v10M10 9v14M22 9v14M26 11v10"/></svg>',
 "Smith":'<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 3v26M26 3v26M3 14h26M9 10v8M23 10v8M3 29h26"/></svg>',
 "Poids du corps":'<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="16" cy="6" r="3"/><path d="M16 9v10M9 13l7 2 7-2M12 29l4-10 4 10"/></svg>',
 "Cardio":'<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 27S4 20 4 11.5A6 6 0 0116 9a6 6 0 0112 2.5C28 20 16 27 16 27z"/><path d="M8 16h4l2-3 3 6 2-3h5"/></svg>',
 "Autre":'<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="16" cy="16" r="11"/><path d="M16 11v10M11 16h10"/></svg>'
};
const KIND_COLS={w:["kg","Reps"],bw:["+kg","Reps"],t:["","Sec"],c:["km","Min"]};

/* ===== Data ===== */
const LS="carnet-muscu-v1", DRAFT="carnet-muscu-draft", PREFS="carnet-muscu-prefs", CUSTOM="carnet-muscu-custom";
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
let sessions=store.get(LS,[]); let draft=store.get(DRAFT,null);
let prefs=Object.assign({rest:90,goal:50},store.get(PREFS,{}));
let customs=store.get(CUSTOM,[]);
let view="seance", progEx=null;
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
const META=new Map();
function buildMeta(){META.clear();LIB.forEach(([nm,m,eq,k])=>META.set(nm,{m,eq,k}));customs.forEach(c=>META.set(c.name,{m:c.m,eq:c.eq,k:c.k,custom:true}))}
buildMeta();
const meta=nm=>META.get(nm)||{m:"Autre",eq:"Autre",k:"w"};
const allExercises=()=>[...LIB.map(([nm,m,eq,k])=>({nm,m,eq,k})),...customs.map(c=>({nm:c.name,m:c.m,eq:c.eq,k:c.k,custom:true}))];

/* ===== Helpers ===== */
const $=s=>document.querySelector(s);
const n=v=>{const x=parseFloat(String(v??"").replace(",","."));return isFinite(x)?x:0};
const e1=(kg,r)=>r>0&&kg>0?kg*(1+r/30):0;
const fmt=x=>Math.round(x).toLocaleString("fr-CH");
const fmt1=x=>(Math.round(x*10)/10).toLocaleString("fr-CH");
const iso=d=>{const x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,10)};
const dt=s=>new Date(s+"T12:00:00");
const isLoad=k=>k==="w"||k==="bw";
const vol=s=>(s.exercises||[]).reduce((a,e)=>isLoad(meta(e.name).k)?a+(e.sets||[]).reduce((b,x)=>b+n(x.kg)*n(x.reps),0):a,0);
const sorted=()=>[...sessions].sort((a,b)=>(b.date||"").localeCompare(a.date||"")||(b.createdAt||0)-(a.createdAt||0));
const mmss=s=>{s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),z=s%60;return h?`${h}:${String(m).padStart(2,"0")}:${String(z).padStart(2,"0")}`:`${m}:${String(z).padStart(2,"0")}`};
function fs(k,x){if(k==="c")return `${n(x.kg)?fmt1(n(x.kg))+" km · ":""}${n(x.reps)} min`;if(k==="t")return `${n(x.reps)} s`;if(k==="bw")return n(x.kg)?`+${fmt1(n(x.kg))}×${n(x.reps)}`:`${n(x.reps)} reps`;return `${fmt1(n(x.kg))}×${n(x.reps)}`}
function h(tag,a={},...k){const el=document.createElement(tag);for(const[key,v]of Object.entries(a)){if(v==null||v===false)continue;if(key==="class")el.className=v;else if(key==="html")el.innerHTML=v;else if(key.startsWith("on"))el.addEventListener(key.slice(2),v);else el.setAttribute(key,v===true?"":v)}k.flat().forEach(c=>{if(c==null||c===false)return;el.append(c.nodeType?c:document.createTextNode(String(c)))});return el}
const ICON={check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>',bar:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 9v6M6 6v12M18 6v12M21 9v6M6 12h12"/></svg>',search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>',swap:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4L3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/></svg>'};
const picto=eq=>h("div",{class:"picto",html:PICTO[eq]||PICTO.Autre});
function toast(msg,red){const t=$("#toast");t.textContent=msg;t.className="toast"+(red?" red":"");t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2200)}
function saveAll(){if(!store.set(LS,sessions))toast("Stockage plein : exporte tes données",true)}
function saveDraft(){draft?store.set(DRAFT,draft):store.del(DRAFT)}
let draftT;const saveDraftSoon=()=>{clearTimeout(draftT);draftT=setTimeout(saveDraft,400)};
const newSets=(c=3)=>Array.from({length:c},()=>({kg:"",reps:"",done:false}));

function lastFor(name){for(const s of sorted()){const e=(s.exercises||[]).find(x=>x.name===name);if(e&&e.sets&&e.sets.length)return{date:s.date,sets:e.sets}}return null}
function bestFor(name){let b=0;sessions.forEach(s=>(s.exercises||[]).forEach(e=>{if(e.name===name)(e.sets||[]).forEach(x=>b=Math.max(b,e1(n(x.kg),n(x.reps))))}));return b}
function series(name){return [...sorted()].reverse().map(s=>{const e=(s.exercises||[]).find(x=>x.name===name);if(!e)return null;const v=Math.max(0,...e.sets.map(x=>e1(n(x.kg),n(x.reps))));const m=Math.max(0,...e.sets.map(x=>n(x.kg)));return v>0?{d:s.date,v,m}:null}).filter(Boolean)}
function exerciseNames(filterLoad){const c={};sessions.forEach(s=>(s.exercises||[]).forEach(e=>{if(!filterLoad||meta(e.name).k==="w")c[e.name]=(c[e.name]||0)+1}));return Object.keys(c).sort((a,b)=>c[b]-c[a])}
function weekStart(d=new Date()){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function streak(){let k=0,w=weekStart();const has=ws=>sessions.some(s=>{const d=dt(s.date);return d>=ws&&d<new Date(ws.getTime()+7*864e5)});if(!has(w))w=new Date(w.getTime()-7*864e5);while(has(w)){k++;w=new Date(w.getTime()-7*864e5)}return k}
const hours=()=>sessions.reduce((a,s)=>a+n(s.duration),0)/60;
function musclesOf(exs){const c={};exs.forEach(e=>{const m=meta(e.name).m;c[m]=(c[m]||0)+(e.sets||[]).length});return Object.keys(c).sort((a,b)=>c[b]-c[a])}
const autoName=exs=>{const m=musclesOf(exs).filter(x=>x!=="Autre");return m.length?m.slice(0,2).join(" · "):"Séance"};

/* ===== Navigation ===== */
function go(v){view=v;document.querySelectorAll(".nav button").forEach(b=>b.setAttribute("aria-current",b.dataset.v===v?"page":"false"));render();window.scrollTo(0,0)}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>go(b.dataset.v));
function head(eyebrow,title){$("#topbar").hidden=false;$("#eyebrow").textContent=eyebrow;$("#vtitle").textContent=title}
function render(){const v=$("#view");v.innerHTML="";clearInterval(render.clock);
  if(view==="seance")(draft?vLive:vStart)(v);else if(view==="programme")vProgram(v);else if(view==="rang")vRank(v);else if(view==="historique")vHist(v);else{vProg(v);vCas(v,true)}}

/* ===== View: start ===== */
function vStart(v){
  const today=new Date();head(today.toLocaleDateString("fr-CH",{weekday:"long",day:"numeric",month:"long"}),"Séance");
  const ws=weekStart(),week=sessions.filter(s=>dt(s.date)>=ws);
  v.append(h("div",{class:"board"},
    h("div",{},h("div",{class:"big"},week.length),h("div",{class:"lbl"},"Cette semaine")),
    h("div",{},h("div",{class:"big"},streak(),h("small",{},"sem.")),h("div",{class:"lbl"},"D'affilée")),
    h("div",{},h("div",{class:"big"},fmt1(hours()),h("small",{},"h")),h("div",{class:"lbl"},"Heures CAS"))));
  const days=["L","M","M","J","V","S","D"],strip=h("div",{class:"week"});
  for(let i=0;i<7;i++){const d=new Date(ws.getTime()+i*864e5),k=iso(d),on=sessions.some(s=>s.date===k);strip.append(h("div",{class:"day"+(on?" on":"")+(k===iso(today)?" today":"")},days[i],h("i",{},d.getDate())))}
  v.append(strip);
  v.append(h("section",{class:"card hero"},h("div",{class:"bar",html:ICON.bar}),
    h("h2",{},"Nouvelle séance"),
    h("div",{class:"muted small"},`Choisis tes exercices parmi ${LIB.length} machines et mouvements de salle. Le chrono démarre tout de suite.`),
    h("button",{type:"button",class:"btn block",onclick:()=>openLibrary(names=>{startSession(names.map(nm=>({name:nm,sets:newSets()})))},true)},"Commencer une séance")));
  // templates = recent distinct sessions
  const seen=new Set(),tmpls=[];
  for(const s of sorted()){const key=(s.exercises||[]).map(e=>e.name).join("|");if(!key||seen.has(key))continue;seen.add(key);tmpls.push(s);if(tmpls.length===3)break}
  if(tmpls.length)v.append(h("section",{class:"card"},h("h2",{},"Refaire une séance"),
    ...tmpls.map(s=>h("button",{type:"button",class:"tmpl",onclick:()=>startSession(s.exercises.map(e=>({name:e.name,sets:newSets(e.sets.length||3)})),s.type)},
      h("div",{},h("b",{},s.type||autoName(s.exercises)),h("span",{},s.exercises.map(e=>e.name).slice(0,3).join(", ")+(s.exercises.length>3?` +${s.exercises.length-3}`:""))),
      h("span",{class:"chip"},dt(s.date).toLocaleDateString("fr-CH",{day:"numeric",month:"short"}))))));
  else v.append(h("div",{class:"empty"},"Tes séances récentes apparaîtront ici pour les refaire en un geste."));
}
function startSession(exercises,name,progDay){draft={startedAt:Date.now(),name:name||"",exercises,note:"",progDay:progDay??null};saveDraft();go("seance")}

/* ===== Exercise library sheet ===== */
function openLibrary(onDone,multi){
  let q="",fm="Tous",fe="Tous";const picked=new Set();
  const list=h("div",{class:"lib-list"});
  const addBtn=h("button",{type:"button",class:"btn block",disabled:true,onclick:()=>{closeSheet();onDone([...picked])}},"Ajouter");
  const updBtn=()=>{addBtn.disabled=!picked.size;addBtn.textContent=picked.size?`Ajouter ${picked.size} exercice${picked.size>1?"s":""}`:"Choisis des exercices"};
  const draw=()=>{list.innerHTML="";const qq=q.trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
    const used=new Set(exerciseNames());
    const items=allExercises().filter(x=>(fm==="Tous"||x.m===fm)&&(fe==="Tous"||x.eq===fe)&&(!qq||x.nm.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").includes(qq)));
    const groups=fm==="Tous"&&!qq?MUSCLES:[...new Set(items.map(x=>x.m))];
    if(!qq&&fm==="Tous"&&fe==="Tous"&&used.size){const rec=items.filter(x=>used.has(x.nm)).slice(0,6);if(rec.length){list.append(h("div",{class:"grp"},"Récents"));rec.forEach(x=>list.append(row(x)))}}

 "Développé militaire":["ohp",1],"Développé épaules haltères":["ohp",.4],"Presse épaules (machine)":["ohp",1],"Élévations latérales haltères":["ohp",.15],"Élévations latérales à la poulie":["ohp",.12],"Élévations latérales (machine)":["ohp",.3],
 "Rowing barre":["bench",.85],"Rowing haltère à un bras":["bench",.4],"Tirage vertical (poulie haute)":["bench",.8],"Tirage vertical (machine)":["bench",.85],"Tirage horizontal assis":["bench",.85],"Rowing assis (machine)":["bench",.85],"Pull-over à la poulie":["bench",.35],"Face pull":["bench",.3],"Oiseau (reverse pec deck)":["bench",.35],
 "Curl barre":["bench",.4],"Curl haltères":["bench",.18],"Curl marteau":["bench",.2],"Curl incliné haltères":["bench",.15],"Extension triceps à la poulie (corde)":["bench",.35],"Barre au front":["bench",.38],
 "Squat":["squat",1],"Hack squat":["squat",1],"Presse à cuisses":["squat",2],"Leg extension":["squat",.55],"Fentes bulgares":["squat",.25],"Leg curl allongé":["squat",.4],"Leg curl assis":["squat",.42],"Soulevé de terre roumain":["dead",.7],"Hip thrust":["dead",1],"Abducteurs (machine)":["squat",.5],"Mollets debout (machine)":["squat",.9],"Mollets assis (machine)":["squat",.55],"Crunch à la poulie":["bench",.45],"Soulevé de terre":["dead",1]};
function baseMax(key){const p=prof()||{},m=(p.max||{})[key];return m&&n(m.kg)?e1(n(m.kg),n(m.reps)||1):0}
function suggest(name,repsLow){
  const k=meta(name).k;if(!isLoad(k))return null;
  let r1=bestFor(name);
  if(!r1&&EST[name]){const [ref,f]=EST[name];const b=ref==="bench"?baseMax("bench"):ref==="squat"?baseMax("squat"):ref==="dead"?baseMax("dead"):baseMax("ohp")||baseMax("bench")*.62;if(b)r1=b*f}
  if(!r1)return null;const w=r1/(1+(repsLow+2)/30),step=meta(name).eq==="Haltères"?2:2.5;return Math.max(step,Math.round(w/step)*step)}
const WD=["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"];
/* Semaine de test : chaque machine une fois, pour mesurer tes charges habituelles. [exercice, séries, reps cibles] */
const TEST=[
 ["Jour 1 · Poussée",[["Développé couché",2,10],["Développé incliné haltères",2,10],["Presse à pectoraux (chest press)",2,10],["Butterfly (pec deck)",2,12],["Développé épaules haltères",2,10],["Presse épaules (machine)",2,10],["Élévations latérales haltères",2,12],["Extension triceps à la poulie (corde)",2,12]]],
 ["Jour 2 · Jambes",[["Squat",2,8],["Presse à cuisses",2,10],["Leg extension",2,12],["Leg curl assis",2,10],["Leg curl allongé",2,10],["Soulevé de terre roumain",2,10],["Hip thrust",2,10],["Mollets debout (machine)",2,12],["Mollets assis (machine)",2,12]]],
 ["Jour 3 · Tirage",[["Tractions",2,8],["Tirage vertical (poulie haute)",2,10],["Tirage vertical (machine)",2,10],["Tirage horizontal assis",2,10],["Rowing barre",2,10],["Rowing haltère à un bras",2,10],["Oiseau (reverse pec deck)",2,12],["Face pull",2,12],["Curl barre",2,10],["Curl marteau",2,10]]],
 ["Jour 4 · Complément",[["Développé militaire",2,8],["Presse inclinée (machine)",2,10],["Écarté à la poulie vis-à-vis",2,12],["Élévations latérales à la poulie",2,12],["Dips",2,8],["Barre au front",2,10],["Hack squat",2,10],["Fentes bulgares",2,10],["Abducteurs (machine)",2,15],["Pull-over à la poulie",2,12],["Crunch à la poulie",2,12],["Gainage",2,45]]]];
function testCard(){
  const done=new Set(prefs.testDone||[]),all=done.size>=TEST.length;
  const c=h("section",{class:"card"+(all?"":" hero")},all?null:h("div",{class:"bar",html:ICON.bar}),
    h("div",{class:"eyebrow"},all?"Phase de test terminée ✓":`Phase de test · ${done.size}/${TEST.length} jours faits`),
    h("h2",{style:"font-size:28px"},"Semaine de test"),
    h("div",{class:"muted small"},all?"Tes charges sont enregistrées : les charges conseillées du programme sont maintenant calculées à partir de tes vraies performances.":"Fais chaque machine avec ta charge habituelle : 1 série d'échauffement légère (non notée), puis 2 séries vers le nombre de reps indiqué, en gardant 1 à 2 reps en réserve. Valide (✓) les 2 séries avec la charge et les reps exactes."));
  TEST.forEach(([title,exs],i)=>{const ok=done.has(i);
    c.append(h("div",{class:"tmpl"},h("div",{},h("b",{},(ok?"✓ ":"")+title),h("span",{},exs.map(e=>e[0].replace(/ \(.*\)/,"")).join(", "))),
      h("button",{type:"button",class:"btn sm"+(ok?" ghost":""),onclick:()=>{if(draft){toast("Termine d'abord ta séance en cours",true);go("seance");return}
        startSession(exs.map(([nm,sets,r])=>({name:nm,sets:Array.from({length:sets},()=>({kg:"",reps:"",done:false,treps:r}))})),"Test · "+title.split(" · ")[1],null);draft.testDay=i;saveDraft()}},ok?"Refaire":"Démarrer")))});
  return c}
function vProgram(v){
  head("Mon programme","Programme");
  const p=prof();
  const testFinished=(prefs.testDone||[]).length>=TEST.length;
  if(!testFinished)v.append(testCard());
  if(!p){v.append(h("div",{class:"card"},h("h2",{},"Crée ton programme"),h("div",{class:"muted small"},"Indique ton poids, ta taille, tes charges max et le nombre de séances par semaine. Le programme et les charges conseillées sont calculés pour toi."),h("button",{type:"button",class:"btn block",onclick:profileSheet},"Remplir mon profil")));return}
  const sp=SPLITS[p.days]||SPLITS[4],idx=(prefs.progIdx||0)%sp.plan.length;
  const bw=n(p.weight),prot=[Math.round(bw*1.6),Math.round(bw*2.2)];
  const kcal=n(p.age)&&n(p.height)?Math.round((10*bw+6.25*n(p.height)-5*n(p.age)+5)*1.55+300):null;
  v.append(h("section",{class:"card hero"},h("div",{class:"bar",html:ICON.bar}),h("div",{class:"eyebrow"},`Objectif : prise de muscle · ${p.level||"Débutant"}`),h("h2",{style:"font-size:28px"},sp.name),
    h("div",{class:"row",style:"gap:6px"},...sp.days.map((d,i)=>h("span",{class:"chip"+(i===idx?" blue":"")},`${WD[d]} · ${sp.plan[i][0]}`))),
    h("div",{class:"grid2"},
      h("div",{},h("div",{class:"big",style:"font-size:30px"},`${prot[0]}–${prot[1]}`,h("small",{},"g")),h("div",{class:"lbl"},"Protéines / jour")),
      h("div",{},h("div",{class:"big",style:"font-size:30px"},kcal?fmt(kcal):"–",h("small",{},"kcal")),h("div",{class:"lbl"},kcal?"Calories / jour (estim.)":"Ajoute ton âge"))),
    h("button",{type:"button",class:"btn ghost sm",style:"justify-self:start",onclick:profileSheet},"Modifier mon profil")));
  sp.plan.forEach(([title,exs],i)=>{
    const card=h("section",{class:"pday"+(i===idx?" next":"")},h("div",{class:"pday-h"},h("div",{},h("div",{class:"eyebrow"},(i===idx?"Prochaine séance · ":"")+WD[sp.days[i]]),h("b",{},title)),
      h("button",{type:"button",class:"btn sm"+(i===idx?"":" ghost"),onclick:()=>{
        if(draft){toast("Termine d'abord ta séance en cours",true);go("seance");return}
        startSession(exs.map(([nm,sets,reps])=>{const lo=parseInt(reps),w=suggest(nm,lo);return{name:nm,sets:Array.from({length:sets},()=>({kg:"",reps:"",done:false,tkg:w||"",treps:lo||""}))}}),title,i)}},"Démarrer")));
    exs.forEach(([nm,sets,reps])=>{const md=meta(nm),lo=parseInt(reps),w=suggest(nm,lo);
      card.append(h("div",{class:"pex"},picto(md.eq),h("div",{},h("b",{},nm),h("span",{},`${md.eq} · ${md.m}`)),
        h("div",{class:"sr"},`${sets} × ${reps}${md.k==="t"?" s":""}`,h("small",{},w?`≈ ${fmt1(w)} kg`:md.k==="bw"?"poids du corps":md.k==="t"?"":"à tester"))))});
    card.append(h("div",{class:"pex",style:"grid-template-columns:1fr"},h("span",{},"+ 5–10 min d'étirements en fin de séance (souplesse)")));
    v.append(card)});
  if(testFinished)v.append(testCard());
  v.append(h("section",{class:"card"},h("h2",{},"Comment progresser"),
    h("div",{class:"small",style:"display:grid;gap:8px"},
      h("div",{},"• Garde 1 à 2 répétitions en réserve sur chaque série, sans aller à l'échec."),
      h("div",{},"• Quand tu atteins le haut de la fourchette (ex. 8 reps sur 6-8) à toutes les séries, ajoute 2,5 kg (haut du corps) ou 5 kg (jambes)."),
      h("div",{},"• Repos : 2–3 min sur les gros exercices, 60–90 s sur l'isolation."),
      h("div",{},"• « à tester » : trouve la charge où tu fais le bas de la fourchette avec 2 reps en réserve. L'appli s'en souviendra."),
      h("div",{},"• Dors 8 h et mange assez : c'est là que le muscle se construit.")),
    h("div",{class:"muted small"},"Charges conseillées calculées à partir de tes maxes et de ton historique. Écoute ton corps : en cas de douleur, baisse la charge et demande conseil à un coach.")));
}
function profileSheet(){
  const p=prof()||{max:{}},mx=p.max||{};
  const inp=(id,val,ph)=>h("input",{type:"number",inputmode:"decimal",id,value:val??"",placeholder:ph||""});
  const w=inp("pW",p.weight,"kg"),ht=inp("pH",p.height,"cm"),ag=inp("pA",p.age,"ans");
  const daysSel=h("select",{id:"pD"},...[3,4,5,6].map(d=>h("option",{value:String(d),selected:(p.days||4)===d},`${d} séances / semaine`)));
  const lvSel=h("select",{id:"pL"},...["Débutant","Intermédiaire","Confirmé"].map(x=>h("option",{selected:(p.level||"Débutant")===x},x)));
  const lift=(key,label)=>{const a=inp("m"+key+"kg",mx[key]?.kg,"kg"),b=inp("m"+key+"r",mx[key]?.reps,"reps");return{key,a,b,el:h("div",{class:"grid3"},h("div",{style:"font-weight:700;font-size:14px;padding-bottom:10px"},label),a,b)}};
  const lifts=[lift("bench","Développé couché"),lift("squat","Squat"),lift("dead","Soulevé de terre"),lift("ohp","Développé militaire")];
  openSheet(h("div",{class:"sheet",role:"dialog","aria-modal":"true","aria-label":"Mon profil"},
    h("h3",{},"Mon profil"),
    h("div",{class:"grid3",style:"grid-template-columns:1fr 1fr 1fr"},h("label",{class:"f"},"Poids",w),h("label",{class:"f"},"Taille",ht),h("label",{class:"f"},"Âge",ag)),
    h("div",{class:"grid2"},h("label",{class:"f"},"Fréquence",daysSel),h("label",{class:"f"},"Niveau",lvSel)),
    h("div",{class:"lbl",style:"margin:0"},"Tes meilleures séries (charge × reps)"),
    h("div",{class:"muted small",style:"margin-top:-8px"},"Laisse vide si tu ne sais pas : l'appli utilisera ton historique."),
    ...lifts.map(l=>l.el),
    h("button",{type:"button",class:"btn block",onclick:()=>{
      if(!n(w.value)){toast("Indique ton poids",true);w.focus();return}
      const max={};lifts.forEach(l=>{if(n(l.a.value))max[l.key]={kg:n(l.a.value),reps:n(l.b.value)||1}});
      const changed=!prefs.profile||prefs.profile.days!==+daysSel.value;
      prefs.profile={weight:n(w.value),height:n(ht.value),age:n(ag.value),days:+daysSel.value,level:lvSel.value,max};if(changed)prefs.progIdx=0;
      store.set(PREFS,prefs);closeSheet();go("programme");toast("Programme généré ✓")}},"Générer mon programme"),
    h("button",{type:"button",class:"btn ghost block",onclick:closeSheet},"Annuler")));
}
