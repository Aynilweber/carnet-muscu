<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0e13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Muscu">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<title>Carnet de muscu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Direction: a gym scoreboard. Graphite floor, chalk-white type, huge condensed numerals.
   Colour is borrowed from bumper plates: plate blue = action, plate red = record. */
:root{
  --bg:#0c0e13; --surface:#151821; --surface-2:#1c202b; --line:#272c39;
  --ink:#eef0f5; --muted:#8b93a7; --faint:#5b6377;
  --blue:#3d6ff2; --blue-soft:rgba(61,111,242,.16);
  --red:#ff5638; --red-soft:rgba(255,86,56,.15);
  --good:#38c98a;
  --display:"Big Shoulders Display","Oswald","Arial Narrow",Impact,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:500 15px/1.45 var(--body);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}

/* Shell */
.app{max-width:640px;margin:0 auto;min-height:100%;padding:calc(10px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(110px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:8px 0 16px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.title{font:900 44px/0.9 var(--display);text-transform:uppercase;letter-spacing:.01em;margin:4px 0 0;text-wrap:balance}
main{display:grid;gap:14px}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(12,14,19,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px calc(8px + env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left))}
.nav-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{display:grid;justify-items:center;gap:2px;padding:6px 0;color:var(--faint);font-size:11px;font-weight:700;letter-spacing:.02em}
.nav button svg{width:24px;height:24px}
.nav button[aria-current="page"]{color:var(--ink)}
.nav button[aria-current="page"] svg{color:var(--blue)}

/* Generic blocks */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px}
.card h2{font:800 22px/1 var(--display);text-transform:uppercase;letter-spacing:.03em;margin:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.muted{color:var(--muted)} .small{font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:13px 18px;font-weight:800;font-size:15px;background:var(--blue);color:#fff;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.block{width:100%}
.btn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--red);border:1px solid rgba(255,86,56,.4)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.chip.blue{background:var(--blue-soft);border-color:transparent;color:#9db7ff}
.chip.red{background:var(--red-soft);border-color:transparent;color:#ff9a86}
input,select,textarea{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--blue);outline:none}
label.f{display:grid;gap:6px;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:28px 18px;text-align:center;color:var(--muted)}

/* Scoreboard stats */
.board{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.board>div{padding:14px 12px;border-right:1px solid var(--line)}
.board>div:last-child{border-right:0}
.big{font:900 40px/0.95 var(--display);font-variant-numeric:tabular-nums}
.big small{font-size:18px;color:var(--muted);margin-left:2px}
.lbl{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:6px}

/* Week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{display:grid;justify-items:center;gap:6px;padding:8px 0;border-radius:10px;font-size:12px;font-weight:700;color:var(--muted)}
.day i{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:13px;color:var(--faint)}
.day.on i{background:var(--blue);border-color:var(--blue);color:#fff}
.day.today{color:var(--ink)}
.day.today i{border-color:var(--ink)}

/* Start session */
.hero{position:relative;overflow:hidden;background:linear-gradient(160deg,#1a2240 0%,var(--surface) 55%);border:1px solid #2a3558}
.hero .bar{position:absolute;right:-30px;top:18px;width:200px;height:200px;opacity:.12;color:#fff;pointer-events:none}
.types{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.type{padding:12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);text-align:left;font-weight:800;font-size:14px}
.type small{display:block;color:var(--muted);font-weight:600;font-size:12px;margin-top:2px}
.type[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}

/* Active session */
.live{position:sticky;top:calc(env(safe-area-inset-top));z-index:10;background:rgba(12,14,19,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);margin:0 -16px;padding:10px 16px;border-bottom:1px solid var(--line)}
.clock{font:900 46px/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.live .meta{display:flex;gap:14px;font-size:12px;color:var(--muted);font-weight:700}
.live .meta b{color:var(--ink);font-size:14px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ex-h{display:flex;gap:8px;align-items:center;padding:12px 12px 6px 14px}
.ex-h input{background:transparent;border:0;padding:4px 0;font:800 22px/1.1 var(--display);text-transform:uppercase;letter-spacing:.02em}
.ex-h input::placeholder{color:var(--faint)}
.ex-prev{padding:0 14px 8px;font-size:12px;color:var(--muted)}
.icon-btn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--muted);flex:none}
.icon-btn:hover{color:var(--ink);background:var(--surface-2)}
.icon-btn svg{width:18px;height:18px}
.sets-h,.set{display:grid;grid-template-columns:30px 1.1fr 1fr 1fr 44px;gap:8px;align-items:center;padding:0 12px}
.sets-h{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);padding-bottom:4px}
.set{padding-top:5px;padding-bottom:5px;transition:background .2s}
.set .n{font:800 18px var(--display);color:var(--muted);text-align:center}
.set .pv{font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.set input{text-align:center;padding:9px 4px;font-weight:800;font-variant-numeric:tabular-nums}
.set input::placeholder{color:var(--faint);font-weight:600}
.check{width:44px;height:40px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;color:var(--faint)}
.check svg{width:20px;height:20px}
.set.done{background:rgba(56,201,138,.08)}
.set.done .check{background:var(--good);border-color:var(--good);color:#06150e}
.set.pr .n{color:var(--red)}
.pr-tag{font:800 10px var(--body);letter-spacing:.08em;color:var(--red);text-transform:uppercase}
.ex-f{display:flex;justify-content:space-between;padding:8px 12px 12px}

/* Rest timer pill */
.rest{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom));z-index:25;display:flex;align-items:center;gap:12px;background:var(--ink);color:#0c0e13;border-radius:999px;padding:8px 8px 8px 10px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.rest[hidden]{display:none}
.rest svg.ring{width:40px;height:40px;transform:rotate(-90deg)}
.rest .t{font:900 28px/1 var(--display);font-variant-numeric:tabular-nums;min-width:62px}
.rest button{white-space:nowrap;background:#0c0e13;color:var(--ink);border-radius:999px;padding:8px 12px;font-weight:800;font-size:13px}
.rest.ding{animation:ding .6s ease 3}
@keyframes ding{50%{transform:translateX(-50%) scale(1.06)}}

/* Sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg[hidden]{display:none}
.sheet{width:100%;max-width:640px;background:var(--surface);border-top-left-radius:22px;border-top-right-radius:22px;border:1px solid var(--line);padding:20px 16px calc(20px + env(safe-area-inset-bottom));display:grid;gap:14px;animation:up .22s ease}
@keyframes up{from{transform:translateY(30px);opacity:.4}}

/* History */
.month{font:800 14px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:10px 2px 0}
.sess{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.sess>button{width:100%;display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:center;padding:12px 14px;text-align:left}
.date-box{display:grid;justify-items:center;background:var(--surface-2);border-radius:10px;padding:6px 0}
.date-box b{font:900 26px/1 var(--display)}
.date-box span{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sess .t1{font-weight:800}
.sess .t2{font-size:12px;color:var(--muted)}
.sess-body{border-top:1px solid var(--line);padding:10px 14px 14px;display:grid;gap:8px}
.sess-body[hidden]{display:none}
.ex-line{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.ex-line span:last-child{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}

/* Progress */
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;border-radius:999px;padding:8px 14px;background:var(--surface-2);border:1px solid var(--line);font-weight:700;font-size:13px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:#0c0e13;border-color:var(--ink)}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
svg.chart text{fill:var(--faint);font:600 10px var(--body)}
svg.chart .g{stroke:var(--line)}
.prs{display:grid;gap:2px}
.pr-row{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:baseline;padding:10px 0;border-top:1px solid var(--line)}
.pr-row:first-child{border-top:0}
.pr-row b{font:900 24px/1 var(--display);font-variant-numeric:tabular-nums}
.pr-row span{font-size:12px;color:var(--muted)}

/* CAS */
.meter{height:12px;border-radius:999px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),#7a9cff);border-radius:999px}
pre.recap{margin:0;white-space:pre-wrap;font:500 13px/1.6 var(--body);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);z-index:60;background:var(--ink);color:#0c0e13;font-weight:800;font-size:14px;padding:10px 16px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast[hidden]{display:none}
.toast.red{background:var(--red);color:#fff}

@media (max-width:380px){.title{font-size:38px}.big{font-size:34px}.sets-h,.set{grid-template-columns:26px 1fr 1fr 1fr 42px;gap:6px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div><div class="eyebrow" id="eyebrow"></div><h1 class="title" id="vtitle">Séance</h1></div>
    <div id="topRight"></div>
  </header>
  <main id="view"></main>
</div>

<div class="rest" id="rest" hidden role="timer" aria-live="polite">
  <svg class="ring" viewBox="0 0 40 40"><circle cx="20" cy="20" r="16" fill="none" stroke="#c9ced9" stroke-width="4"/><circle id="restArc" cx="20" cy="20" r="16" fill="none" stroke="#3d6ff2" stroke-width="4" stroke-linecap="round" stroke-dasharray="100.5" stroke-dashoffset="0"/></svg>
  <div><div style="font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.6">Repos</div><div class="t" id="restT">1:30</div></div>
  <button type="button" id="restPlus">+15 s</button>
  <button type="button" id="restSkip">Passer</button>
</div>

<div class="sheet-bg" id="sheet" hidden></div>
<div class="toast" id="toast" hidden role="status"></div>

<nav class="nav" aria-label="Navigation">
  <div class="nav-in">
    <button type="button" data-v="seance"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 9v6M6 6v12M18 6v12M21 9v6M6 12h12"/></svg>Séance</button>
    <button type="button" data-v="historique"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Historique</button>
    <button type="button" data-v="progres"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>Progrès</button>
    <button type="button" data-v="cas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3 6.5 7 .8-5.2 4.8 1.4 7L12 17.6 5.8 21l1.4-7L2 9.3l7-.8z"/></svg>CAS</button>
  </div>
</nav>

<script>
/* ===== Data ===== */
const LS="carnet-muscu-v1", DRAFT="carnet-muscu-draft", PREFS="carnet-muscu-prefs";
const EXOS=["Développé couché","Développé incliné haltères","Développé militaire","Élévations latérales","Dips","Extension triceps poulie","Pompes","Tractions","Rowing barre","Rowing haltère","Tirage vertical","Curl biceps","Curl marteau","Face pull","Squat","Soulevé de terre","Soulevé de terre roumain","Presse à cuisses","Fentes","Leg curl","Leg extension","Hip thrust","Mollets debout","Gainage (secondes)","Crunch"];
const TYPES=[["Push","Pecs · épaules · triceps"],["Pull","Dos · biceps"],["Jambes","Quadris · ischios · fessiers"],["Full body","Tout le corps"],["Haut du corps","Push + pull"],["Souplesse","Mobilité · étirements"]];
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
let sessions=store.get(LS,[]); let draft=store.get(DRAFT,null);
let prefs=Object.assign({rest:90,goal:50},store.get(PREFS,{}));
let view=draft?"seance":"seance", progEx=null, pickedType="Push";
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

/* ===== Helpers ===== */
const $=s=>document.querySelector(s);
const n=v=>{const x=parseFloat(String(v??"").replace(",","."));return isFinite(x)?x:0};
const e1=(kg,r)=>r>0?kg*(1+r/30):0;
const fmt=x=>Math.round(x).toLocaleString("fr-CH");
const fmt1=x=>(Math.round(x*10)/10).toLocaleString("fr-CH");
const iso=d=>{const x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,10)};
const dt=s=>new Date(s+"T12:00:00");
const vol=s=>(s.exercises||[]).reduce((a,e)=>a+(e.sets||[]).reduce((b,x)=>b+n(x.kg)*n(x.reps),0),0);
const sorted=()=>[...sessions].sort((a,b)=>(b.date||"").localeCompare(a.date||"")||(b.createdAt||0)-(a.createdAt||0));
const mmss=s=>{s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),z=s%60;return h?`${h}:${String(m).padStart(2,"0")}:${String(z).padStart(2,"0")}`:`${m}:${String(z).padStart(2,"0")}`};
function h(tag,a={},...k){const el=document.createElement(tag);for(const[key,v]of Object.entries(a)){if(v==null||v===false)continue;if(key==="class")el.className=v;else if(key==="html")el.innerHTML=v;else if(key.startsWith("on"))el.addEventListener(key.slice(2),v);else el.setAttribute(key,v===true?"":v)}k.flat().forEach(c=>{if(c==null||c===false)return;el.append(c.nodeType?c:document.createTextNode(String(c)))});return el}
const ICON={x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>',bar:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 9v6M6 6v12M18 6v12M21 9v6M6 12h12"/></svg>'};
function toast(msg,red){const t=$("#toast");t.textContent=msg;t.className="toast"+(red?" red":"");t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2200)}
function saveAll(){if(!store.set(LS,sessions))toast("Stockage plein : exporte tes données",true)}
function saveDraft(){draft?store.set(DRAFT,draft):store.del(DRAFT)}
let draftT;const saveDraftSoon=()=>{clearTimeout(draftT);draftT=setTimeout(saveDraft,400)};

/* History lookups */
function lastFor(name){for(const s of sorted()){const e=(s.exercises||[]).find(x=>x.name===name);if(e&&e.sets&&e.sets.length)return{date:s.date,sets:e.sets}}return null}
function bestFor(name){let b=0;sessions.forEach(s=>(s.exercises||[]).forEach(e=>{if(e.name===name)(e.sets||[]).forEach(x=>b=Math.max(b,e1(n(x.kg),n(x.reps))))}));return b}
function series(name){return [...sorted()].reverse().map(s=>{const e=(s.exercises||[]).find(x=>x.name===name);if(!e)return null;const v=Math.max(0,...e.sets.map(x=>e1(n(x.kg),n(x.reps))));const m=Math.max(0,...e.sets.map(x=>n(x.kg)));return v>0?{d:s.date,v,m}:null}).filter(Boolean)}
function exerciseNames(){const c={};sessions.forEach(s=>(s.exercises||[]).forEach(e=>c[e.name]=(c[e.name]||0)+1));return Object.keys(c).sort((a,b)=>c[b]-c[a])}
function weekStart(d=new Date()){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function streak(){let k=0,w=weekStart();const has=ws=>sessions.some(s=>{const d=dt(s.date);return d>=ws&&d<new Date(ws.getTime()+7*864e5)});if(!has(w))w=new Date(w.getTime()-7*864e5);while(has(w)){k++;w=new Date(w.getTime()-7*864e5)}return k}
const hours=()=>sessions.reduce((a,s)=>a+n(s.duration),0)/60;

/* ===== Navigation ===== */
function go(v){view=v;document.querySelectorAll(".nav button").forEach(b=>b.setAttribute("aria-current",b.dataset.v===v?"page":"false"));render();window.scrollTo(0,0)}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>go(b.dataset.v));
function head(eyebrow,title,right){$("#eyebrow").textContent=eyebrow;$("#vtitle").textContent=title;const r=$("#topRight");r.innerHTML="";if(right)r.append(right)}

  const names=exerciseNames().slice(0,4);
